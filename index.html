<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>統計自治体</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  #app { display: flex; height: 100vh; }
  #map {
    flex: 1; outline: none; min-width: 0; min-height: 0;
    background-color: #1f6fb8;
    background-image:
      repeating-linear-gradient(135deg,
        rgba(255,255,255,0.10) 0,
        rgba(255,255,255,0.10) 1px,
        transparent 1px,
        transparent 14px);
  }
  #map:focus, .leaflet-container:focus, .leaflet-interactive:focus { outline: none !important; }
  .leaflet-zoom-box { display: none !important; }
  #panel {
    width: 340px; background: #fff; border-left: 1px solid #ddd;
    padding: 16px 20px; overflow-y: auto; box-shadow: -2px 0 6px rgba(0,0,0,0.04);
    flex-shrink: 0;
  }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    #map { flex: 0 0 55vh; width: 100%; }
    #panel {
      width: 100%; height: 45vh; border-left: none; border-top: 1px solid #ddd;
      padding: 12px 14px; box-shadow: 0 -2px 6px rgba(0,0,0,0.04);
      box-sizing: border-box;
    }
    #loading { font-size: 16px; padding: 16px 24px; min-width: 220px; }
  }
  .metric-label {
    display: block; font-size: 12px; color: #666; margin-bottom: 4px;
  }
  #metric-select {
    display: block; width: 100%; padding: 6px 8px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 4px; margin-top: 4px; margin-bottom: 4px;
    background: #fff; cursor: pointer;
  }
  .metric-note {
    font-size: 11px; color: #c47b00; margin-bottom: 6px; min-height: 14px;
  }
  .legend-note {
    font-size: 11px; color: #555; margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .legend-swatch {
    display: inline-block; width: 14px; height: 14px;
    background: #111; border: 1px solid #444; border-radius: 2px;
  }
  .color-legend { margin-bottom: 6px; }
  .legend-bar {
    height: 10px; border-radius: 2px;
    background: linear-gradient(to right, #eee, #999);
    border: 1px solid rgba(0,0,0,0.1);
  }
  .legend-labels {
    display: flex; justify-content: space-between;
    font-size: 10px; color: #555; margin-top: 3px;
  }
  .detail-section { margin-bottom: 14px; font-size: 18px; line-height: 1.4; color: #111; font-weight: 600; }
  .detail-section strong { color: #555; font-size: 12px; font-weight: 600; display: block; margin-bottom: 2px; letter-spacing: 0.05em; }
  .pop-rank { color: #333; font-size: 13px; font-weight: 500; margin-top: 4px; }
  .wiki-thumb {
    width: 100%; max-height: 160px; object-fit: cover; border-radius: 4px;
    margin-bottom: 10px;
  }
  .wiki-extract { color: #333; font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
  .wiki-sections h3 { font-size: 12px; color: #888; margin: 14px 0 6px; font-weight: 500; }
  .wiki-sections a {
    display: block; padding: 6px 8px; margin-bottom: 4px;
    background: #f6f6f6; border-radius: 3px; text-decoration: none;
    color: #2a5f8f; font-size: 13px;
  }
  .wiki-sections a:hover { background: #ebebeb; }
  .wiki-sections a.full { background: #2a5f8f; color: #fff; }
  .wiki-sections a.full:hover { background: #1f4670; }
  #panel h1 { font-size: 16px; margin: 0 0 4px; color: #888; font-weight: 500; }
  #panel h2 { font-size: 22px; margin: 0 0 16px; }
  #panel .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
  #panel .placeholder { color: #aaa; font-size: 13px; line-height: 1.6; }
  #back {
    display: none; margin-bottom: 12px; padding: 6px 12px;
    background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  #back:hover { background: #ececec; }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.78); color: #fff;
    padding: 24px 40px; border-radius: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: 0.05em;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    z-index: 1000; display: none;
    min-width: 280px; text-align: center;
  }
  #loading-label { margin-bottom: 12px; }
  #loading-bar {
    width: 100%; height: 8px; background: rgba(255,255,255,0.2);
    border-radius: 4px; overflow: hidden;
  }
  #loading-bar-fill {
    height: 100%; background: linear-gradient(90deg, #4fa3ff, #69c0ff);
    width: 0%; transition: width 0.3s ease;
  }
  #loading-sub {
    font-size: 12px; color: #ccc; margin-top: 8px;
    font-weight: 400; letter-spacing: 0;
  }
  .pref { stroke: #5b8db8; stroke-width: 0.7; cursor: pointer; transition: fill 0.15s; }
  /* fill は Leaflet の setStyle (fillColor) で動的に設定 — CSS で書くと SVG fill 属性を上書きしてヒートマップが効かない */
  .pref:hover { fill: #9ec3e0; }
  #baseball-teams {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .team-btn {
    font-size: 11px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px;
    background: #fff; cursor: pointer; color: #333; text-align: center;
    white-space: nowrap;
  }
  .team-btn:hover { background: #f0f0f0; }
  .team-btn.active { background: #1976d2; color: #fff; border-color: #1976d2; }
  .pref-border {
    fill: transparent; stroke: #0d2238; stroke-width: 4;
    stroke-linejoin: round; stroke-linecap: round;
    pointer-events: none;
  }
  .city { stroke: #8a6a2a; stroke-width: 0.5; cursor: pointer; transition: filter 0.15s, opacity 0.12s; }
  .city:hover { filter: brightness(0.85); }
  .city.selected { stroke: #c00; stroke-width: 1.5; }
  .pref-label-marker {
    color: #1a3a5c; font-size: 13px; font-weight: 600;
    letter-spacing: 0.05em;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    white-space: nowrap; pointer-events: none;
    transform: translate(-50%, -50%);
    display: inline-block;
  }
  .city-label-marker {
    color: #222; font-size: 10px; font-weight: 500;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    white-space: nowrap; pointer-events: none;
    transform: translate(-50%, -50%);
    display: inline-block;
  }
  .city-label-dc {
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
  }
  .sea-label {
    color: #3a6b8c; font-weight: 500; font-size: 15px;
    letter-spacing: 0.3em; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
    white-space: nowrap; pointer-events: none;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  }
  .sea-label.big { font-size: 20px; letter-spacing: 0.5em; }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="loading">
      <div id="loading-label">読み込み中…</div>
      <div id="loading-bar"><div id="loading-bar-fill"></div></div>
      <div id="loading-sub"></div>
    </div>
  </div>
  <div id="panel">
    <label class="metric-label">表示するヒートマップ
      <select id="metric-select"></select>
    </label>
    <div id="metric-note" class="metric-note"></div>
    <div id="baseball-teams" style="display:none; margin: 6px 0 12px;"></div>
    <div class="color-legend">
      <div class="legend-bar" id="legend-bar"></div>
      <div class="legend-labels">
        <span id="legend-min">—</span>
        <span id="legend-mid">—</span>
        <span id="legend-max">—</span>
      </div>
    </div>
    <div id="legend-nodata" class="legend-note"><span class="legend-swatch"></span>黒色: データなし</div>
    <div id="metric-footnote" class="legend-note" style="display:none; padding-left:0;"></div>
    <div id="metric-extra" style="display:none; font-size:11px; color:#444; margin: 6px 0 14px; line-height:1.5;"></div>
    <h1 id="title"></h1>
    <h2 id="subtitle"></h2>
    <div id="content" class="placeholder"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

async function fetchEarthquakeCounts() {
  if (!nationalPointLookup) throw new Error("ポリゴンデータ未ロード");
  console.log("[earthquake] load local data/earthquake-raw.json");
  const res = await fetch("data/earthquake-raw.json");
  if (!res.ok) throw new Error(`earthquake-raw HTTP ${res.status}`);
  const data = await res.json();
  const counts = new Map();
  let assigned = 0, unassigned = 0;
  for (const f of data.features || []) {
    const coord = f.geometry?.coordinates;
    if (!coord || coord.length < 2) continue;
    let code = nationalPointLookup(coord[0], coord[1]);
    if (!code && nationalNearestMuni) {
      code = nationalNearestMuni(coord[0], coord[1], 1.5);
    }
    if (code) {
      // マグニチュード加重: 10^(mag-5) で M7大震災 = 100個分のM5地震、M8 = 1000個分
      const mag = Number(f.properties?.mag) || 5;
      const weight = Math.pow(10, Math.max(0, mag - 5));
      counts.set(code, (counts.get(code) || 0) + weight);
      assigned++;
    } else {
      unassigned++;
    }
  }
  // 値を整数化
  for (const [k, v] of counts) counts.set(k, Math.round(v));
  console.log(`[earthquake] events=${data.features?.length || 0}, assigned=${assigned}, unassigned=${unassigned}, munis=${counts.size}`);
  return counts;
}

async function fetchChainStoreData(tag, url) {
  if (!nationalNameLookup) throw new Error("ポリゴンデータ未ロード");
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${tag} HTTP ${res.status}`);
  const entries = await res.json();
  const map = new Map();
  let matched = 0, missed = 0;
  for (const [pref, muni, count] of entries) {
    const codes = nationalNameLookup(pref, muni);
    if (codes && codes.length) {
      const per = count / codes.length;
      for (const c of codes) {
        map.set(c, (map.get(c) || 0) + per);
      }
      matched++;
    } else {
      missed++;
    }
  }
  for (const [k, v] of map) map.set(k, Math.round(v * 10) / 10);
  console.log(`[${tag}] matched=${matched} missed=${missed} total=${map.size} muni`);
  return map;
}

async function _unused_fetchBestSSDSMetric(tag, nameRegex, excludeRegex) {

        if (!nameRegex.test(name) || excludeRegex.test(name)) continue;
        const catParam = "cd" + c["@id"].charAt(0).toUpperCase() + c["@id"].slice(1);
        const catField = "@" + c["@id"];
        const dataUrl = "https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData?"
          + `appId=${ESTAT_APP_ID}&statsDataId=${tid}&${catParam}=${code}&limit=100000`;

        const vals = (json.GET_STATS_DATA?.STATISTICAL_DATA?.DATA_INF?.VALUE || [])
          .filter(v => String(v[catField] || "") === code);
        const latest = new Map();
        for (const v of vals) {
          const area = String(v["@area"] || "");
          if (!/^\d{5}$/.test(area)) continue;
          const year = String(v["@time"] || "");

        }
        console.log(`[${tag}] ${tid}/${code} "${name}" → ${latest.size}`);
        if (latest.size > (best?.size || 0)) {
          best = { tid, code, name, size: latest.size, latest };
        }
      }
    }

function ringSignedArea(ring) {
  let a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
  }
  return a / 2;
}
function ringCentroid(ring) {
  let x = 0, y = 0, a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const cross = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    a += cross;
    x += (ring[j][0] + ring[i][0]) * cross;
    y += (ring[j][1] + ring[i][1]) * cross;
  }
  a *= 0.5;
  if (a === 0) {
    let sx = 0, sy = 0;
    for (const p of ring) { sx += p[0]; sy += p[1]; }
    return [sy / ring.length, sx / ring.length];
  }
  return [y / (6 * a), x / (6 * a)];
}
function largestPolygonCentroid(geometry) {
  let polys = [];
  if (!geometry) return null;
  if (geometry.type === "Polygon") polys = [geometry.coordinates];
  else if (geometry.type === "MultiPolygon") polys = geometry.coordinates;
  else return null;
  let bestRing = null, bestArea = 0;
  for (const poly of polys) {
    const ring = poly[0];
    if (!ring || ring.length < 3) continue;
    const area = Math.abs(ringSignedArea(ring));
    if (area > bestArea) { bestArea = area; bestRing = ring; }
  }
  return bestRing ? ringCentroid(bestRing) : null;
}

function canonicalEdge(a, b) {
  const r = x => Math.round(x * 1e6) / 1e6;
  const sa = `${r(a[0])},${r(a[1])}`;
  const sb = `${r(b[0])},${r(b[1])}`;
  return sa < sb ? `${sa}|${sb}` : `${sb}|${sa}`;
}
function samePoint(a, b) {
  return Math.abs(a[0] - b[0]) < 1e-7 && Math.abs(a[1] - b[1]) < 1e-7;
}
function computeDCOutlineLatLngs(info) {
  const edgeCount = new Map();
  const allEdges = [];
  for (const m of info.members) {
    for (const r of m.rings) {
      const ring = r.ring;
      for (let i = 0; i < ring.length - 1; i++) {
        const key = canonicalEdge(ring[i], ring[i+1]);
        edgeCount.set(key, (edgeCount.get(key) || 0) + 1);
        allEdges.push([ring[i], ring[i+1], key]);
      }
    }
  }
  const outerEdges = allEdges.filter(e => edgeCount.get(e[2]) === 1).map(e => [e[0], e[1]]);
  const rings = [];
  const remaining = outerEdges;
  while (remaining.length) {
    const start = remaining.shift();
    const ring = [start[0], start[1]];
    while (remaining.length) {
      const last = ring[ring.length - 1];
      let idx = -1, next = null;
      for (let i = 0; i < remaining.length; i++) {
        if (samePoint(remaining[i][0], last)) { idx = i; next = remaining[i][1]; break; }
        if (samePoint(remaining[i][1], last)) { idx = i; next = remaining[i][0]; break; }
      }
      if (idx < 0) break;
      ring.push(next);
      remaining.splice(idx, 1);
      if (samePoint(next, ring[0])) break;
    }
    if (ring.length >= 3) rings.push(ring);
  }
  // GeoJSON [lng, lat] → Leaflet [lat, lng]
  return rings.map(ring => ring.map(p => [p[1], p[0]]));
}

function applyPrefHeatmap() {
  if (!prefLayer) return;
  const z = map.getZoom();
  const lowZoom = z < ZOOM_ALL_THRESHOLD;
  const samples = [...nationalPrefAggregates.entries()].slice(0, 5).map(([k,v]) => `${k}=${v}`).join(", ");
  console.log(`[applyPrefHeatmap] metric=${activeMetric} z=${z} lowZoom=${lowZoom} aggregates=${nationalPrefAggregates.size} samples={${samples}} scale=${nationalPrefScale.minLog.toFixed(2)}..${nationalPrefScale.maxLog.toFixed(2)}`);
  prefLayer.eachLayer(l => {
    if (!lowZoom) {
      // 高ズーム時は通常スタイル(透明境界線)
      l.setStyle({ color: "#0d2238", weight: 4, fillOpacity: 0 });
      return;
    }
    const name = l.feature.properties.nam_ja || l.feature.properties.name_ja || l.feature.properties.name;
    const v = nationalPrefAggregates.get(name);
    if (v && v > 0) {
      // military / nuclear は内訳から色を決定
      let fill;
      if (activeMetric === "military") {
        const jsdf = nationalPrefAggregates.get(name + "::jsdf") || 0;
        const us = nationalPrefAggregates.get(name + "::us") || 0;
        // 米軍が1つでもあれば米軍色、なければ自衛隊色。 濃淡は count(=v) に応じて。
        const base = us > 0 ? [0, 188, 212] : [214, 40, 40];
        const ease = Math.min(1, 0.25 + Math.log10(v + 1) / Math.log10(20));
        const fr = Math.round(255 - (255 - base[0]) * ease);
        const fg = Math.round(255 - (255 - base[1]) * ease);
        const fb = Math.round(255 - (255 - base[2]) * ease);
        fill = `rgb(${fr},${fg},${fb})`;
      } else if (activeMetric === "nuclear") {
        const active = nationalPrefAggregates.get(name + "::active") || 0;
        const cancelled = nationalPrefAggregates.get(name + "::cancelled") || 0;
        const base = active > 0 ? [214, 40, 40] : [242, 194, 0];
        const ease = Math.min(1, 0.30 + Math.log10(v + 1) / Math.log10(15));
        const fr = Math.round(255 - (255 - base[0]) * ease);
        const fg = Math.round(255 - (255 - base[1]) * ease);
        const fb = Math.round(255 - (255 - base[2]) * ease);
        fill = `rgb(${fr},${fg},${fb})`;
      } else if (["water100","hyakumeizan","dam","airport","park"].includes(activeMetric)) {
        // 単一状態の二値: 自治体 count に応じて該当色のグラデーション
        const colorMap = {
          water100:  [31, 191, 143],
          hyakumeizan:[46, 157,  74],
          dam:        [  0, 188, 212],
          airport:    [  0, 167, 142],
          park:       [ 29, 111,  60]
        };
        const base = colorMap[activeMetric];
        const ease = Math.min(1, 0.25 + Math.log10(v + 1) / Math.log10(30));
        const fr = Math.round(255 - (255 - base[0]) * ease);
        const fg = Math.round(255 - (255 - base[1]) * ease);
        const fb = Math.round(255 - (255 - base[2]) * ease);
        fill = `rgb(${fr},${fg},${fb})`;
      } else {
        fill = popColor(v, nationalPrefScale.minLog, nationalPrefScale.maxLog);
      }
      l.setStyle({
        fillColor: fill,
        fillOpacity: 0.85,
        color: "#5b8db8", weight: 0.7
      });
    } else if (activeMetric === "water100" || activeMetric === "hyakumeizan" || activeMetric === "nuclear" || activeMetric === "dam" || activeMetric === "military" || activeMetric === "heisei" || activeMetric === "airraid" || activeMetric === "park" || activeMetric === "ohsho" || activeMetric === "yamaokaya" || activeMetric === "rasho" || activeMetric === "yakimono" || activeMetric === "airport" || activeMetric === "sake" || activeMetric === "baseball" || activeMetric === "aging" || activeMetric === "bear") {
      // 非該当県は白で表示
      l.setStyle({ fillColor: "#ffffff", fillOpacity: 0.9, color: "#5b8db8", weight: 0.7 });
    } else {
      l.setStyle({ fillColor: "#111", fillOpacity: 0.9, color: "#5b8db8", weight: 0.7 });
    }
  });
}

function popColor(pop, minLog, maxLog) {
  if (activeMetric === "paidBag") {
    return pop >= 0.5 ? "#c00" : "#ffffff";
  }
  if (activeMetric === "water100") {
    // 緑よりのシアン (認定自治体) / 白 (非認定)
    return pop >= 0.5 ? "#1fbf8f" : "#ffffff";
  }
  if (activeMetric === "hyakumeizan") {
    // 山が所在する自治体: 緑 / それ以外: 白
    return pop >= 0.5 ? "#2e9d4a" : "#ffffff";
  }
  if (activeMetric === "park") {
    // 国立公園所在: 深緑 / それ以外: 白
    return pop >= 0.5 ? "#1d6f3c" : "#ffffff";
  }
  if (activeMetric === "nuclear") {
    // 1=現存(赤), 2=計画中止(黄), それ以外=白
    if (pop === 1) return "#d62828";
    if (pop === 2) return "#f2c200";
    return "#ffffff";
  }
  if (activeMetric === "dam") {
    // ダム所在自治体: シアン / それ以外: 白
    return pop >= 0.5 ? "#00bcd4" : "#ffffff";
  }
  if (activeMetric === "military") {
    // 1=自衛隊(赤), 2=米軍(シアン), それ以外=白
    if (pop === 1) return "#d62828";
    if (pop === 2) return "#00bcd4";
    return "#ffffff";
  }
  if (activeMetric === "heisei") {
    // 合併件数 0 (== 未マッピング) は白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "airraid") {
    // 空襲記録なし → 白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "ohsho") {
    // 王将店舗なし → 白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "yamaokaya") {
    // 山岡家店舗なし → 白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "rasho") {
    // ラーメンショップなし → 白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "yakimono") {
    // 焼き物なし → 白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "airport") {
    // 空港あり=シアン緑 / なし=白
    return pop >= 0.5 ? "#00a78e" : "#ffffff";
  }
  if (activeMetric === "sake") {
    // 蔵元なし → 白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "baseball") {
    // 該当なし → 白
    if (!pop || pop <= 0) return "#ffffff";
    // 球団色のグラデーション
    const team = NPB_TEAMS.find(t => t.key === baseballTeam) || NPB_TEAMS[0];
    const [r, g, b] = team.color;
    // 値を正規化 (log scale)
    const t = Math.min(1, Math.max(0, (Math.log10(pop) - minLog) / (maxLog - minLog)));
    // 淡 → 濃 (白から team.color へ)
    const ease = 0.15 + t * 0.85; // 最低でも 15% は team color を反映
    const fr = Math.round(255 - (255 - r) * ease);
    const fg = Math.round(255 - (255 - g) * ease);
    const fb = Math.round(255 - (255 - b) * ease);
    return `rgb(${fr},${fg},${fb})`;
  }
  if (activeMetric === "bear") {
    // 0 / 未収集自治体は白
    if (!pop || pop <= 0) return "#ffffff";
  }
  if (activeMetric === "aging") {
    // 限界集落: 50%未満は白、50%以上のみ赤系で強調
    if (!pop || pop < 50) return "#ffffff";
  }
  if (!pop || pop <= 0) return "#f0f0f0";
  const t = Math.min(1, Math.max(0, (Math.log10(pop) - minLog) / (maxLog - minLog)));
  const stops = METRIC_PALETTES[activeMetric] || METRIC_PALETTES.population;
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i-1], [t1, c1] = stops[i];
      const u = (t - t0) / (t1 - t0);
      const r = Math.round(c0[0] + (c1[0]-c0[0])*u);
      const g = Math.round(c0[1] + (c1[1]-c0[1])*u);
      const b = Math.round(c0[2] + (c1[2]-c0[2])*u);
      return `rgb(${r},${g},${b})`;
    }
  }
  const last = stops[stops.length - 1][1];
  return `rgb(${last[0]},${last[1]},${last[2]})`;
}

async function loadPrefectures() {
  showLoad(true);
  // popup fallback 用の SSDS 人口を先読み (失敗してもページ動作には支障なし)
  loadLocalMap("_ssds_pop").then(m => metricDataCache.set("_ssds_pop", m)).catch(() => {});
  const res = await fetch(PREF_URL);
  const topo = await res.json();
  const geo = topojson.feature(topo, topo.objects.japan);
  prefLabelLayer = L.layerGroup();
  prefLayer = L.geoJSON(geo, {
    style: () => ({ className: "pref", fillOpacity: 0.75 }),
    onEachFeature: (feature, layer) => {
      const name = feature.properties.nam_ja || feature.properties.name_ja || feature.properties.name;
      layer.on("click", (e) => {
        L.DomEvent.stopPropagation(e);
        map.flyTo(layer.getBounds().getCenter(), Math.max(map.getZoom() + 1, LABEL_ZOOM), { duration: 0.6 });
      });
      layer.on("mouseover", () => {
        if (nationalHasSelection()) return;
        if (!nationalPolygonLayer || !map.hasLayer(nationalPolygonLayer)) return;
        nationalPolygonLayer.eachLayer(c => {
          if ((c.feature.properties.N03_001 || "") !== name) {
            c.setStyle({ fillOpacity: 0.7 });
          }
        });
      });
      layer.on("mouseout", () => {
        if (nationalHasSelection()) return;
        if (!nationalPolygonLayer || !map.hasLayer(nationalPolygonLayer)) return;
        nationalPolygonLayer.eachLayer(c => c.setStyle({ fillOpacity: 0.9 }));
      });
      const c = largestPolygonCentroid(feature.geometry);
      if (c && isFinite(c[0]) && isFinite(c[1])) {
        L.marker(c, {
          interactive: false, keyboard: false,
          icon: L.divIcon({ className: "", html: `<div class="pref-label-marker">${name}</div>`, iconSize: [0, 0] })
        }).addTo(prefLabelLayer);
      }
    }
  }).addTo(map);
  prefLabelLayer.addTo(map);
  prefBounds = prefLayer.getBounds();
  map.fitBounds(prefBounds, { padding: [10, 10] });
  showLoad(false);
  onMoveEnd();
}

async function buildNationalLayer() {
  showLoad(true);
  try {
    const [topoRes, initialMap] = await Promise.all([
      fetch(ALL_CITIES_URL).then(r => r.json()),
      METRICS[activeMetric].loader().catch(() => new Map())
    ]);
    metricDataCache.set(activeMetric, initialMap);
    const popMap = new Map(initialMap);
    const scale = { minLog: 3, maxLog: 6.5 };
    const objKey = Object.keys(topoRes.objects)[0];
    const geo = topojson.feature(topoRes, topoRes.objects[objKey]);

    const EXCLAVE_RATIO = 0.1;
    const cityGroup = new Map();
    for (const f of geo.features) {
      const props = f.properties;
      const k = mergeKeyOf(props);
      let info = cityGroup.get(k);
      if (!info) {
        const isDC = isDesignatedWardProps(props);
        info = {
          mergeKey: k,
          isDesignated: isDC,
          displayName: isDC ? props.N03_003 : (props.N03_004 || "(不明)"),
          prefName: props.N03_001 || "",
          members: []
        };
        cityGroup.set(k, info);
      }
      const polys = f.geometry?.type === "Polygon" ? [f.geometry.coordinates]
                  : f.geometry?.type === "MultiPolygon" ? f.geometry.coordinates : [];
      const rings = [];
      for (const poly of polys) {
        const ring = poly[0];
        if (!ring || ring.length < 3) continue;
        rings.push({ ring, area: Math.abs(ringSignedArea(ring)) });
      }
      info.members.push({
        name: props.N03_004 || "(不明)",
        code5: String(props.N03_007 || "").slice(0, 5),
        rings
      });
    }
    function recomputeAggregates() {
      // 平均で集計したい指標 (密度系・1人当たり系など加法的でないもの)
      const isAverageMetric = activeMetric === "density" || activeMetric === "paidBag" || activeMetric === "restaurant" || activeMetric === "aging" || activeMetric === "rainfall" || activeMetric === "avgAge" || activeMetric === "vacancy";
      const allowZero = activeMetric === "paidBag";
      for (const info of cityGroup.values()) {
        let total = 0, any = false, count = 0;
        const seen = new Set();
        for (const m of info.members) {
          const v = popMap.get(m.code5);
          if (v !== undefined && (allowZero ? (v === 0 || v === 1) : v > 0)) {
            if (!seen.has(v)) { total += v; seen.add(v); count++; }
            any = true;
          }
        }
        info.aggregatePop = any
          ? (isAverageMetric && count > 0 ? (allowZero ? (total / count >= 0.5 ? 1 : 0) : Math.round(total / count)) : total)
          : null;
      }
      const vals = [];
      for (const v of popMap.values()) if (v > 0) vals.push(v);
      for (const info of cityGroup.values()) if (info.isDesignated && info.aggregatePop) vals.push(info.aggregatePop);
      if (activeMetric === "aging") {
        // 限界集落: 50%以上だけ強調 (50%→淡 / 75%→濃)
        scale.minLog = Math.log10(50);
        scale.maxLog = Math.log10(75);
      } else if (activeMetric === "avgAge") {
        // 平均年齢は固定スケール: 40歳〜65歳
        scale.minLog = Math.log10(40);
        scale.maxLog = Math.log10(65);
      } else if (activeMetric === "vacancy") {
        // 空き家率は固定スケール: 10%〜40%(過疎自治体は40%超)
        scale.minLog = Math.log10(10);
        scale.maxLog = Math.log10(40);
      } else if (activeMetric === "rainfall") {
        // 降水量は固定スケール: 1200〜2800 mm/年(典型分布に色を集中)
        scale.minLog = Math.log10(1200);
        scale.maxLog = Math.log10(2800);
      } else if (vals.length) {
        vals.sort((a, b) => a - b);
        // 森林は閾値を上げる: 30〜99 パーセンタイル
        // それ以外: 5〜95 パーセンタイル
        const isForestLike = activeMetric === "forest";
        const loP = isForestLike ? 0.30 : 0.05;
        const hiP = isForestLike ? 0.99 : 0.95;
        const pLo = vals[Math.max(0, Math.floor(vals.length * loP))];
        const pHi = vals[Math.min(vals.length - 1, Math.floor(vals.length * hiP))];
        scale.minLog = Math.log10(Math.max(pLo, 1e-3));
        scale.maxLog = Math.log10(Math.max(pHi, pLo * 1.01));
      } else {
        scale.minLog = 0; scale.maxLog = 1;
      }
    }
    recomputeAggregates();

    const expandedSet = new Set();
    const styleFor = (feature) => {
      const k = mergeKeyOf(feature.properties);
      const info = cityGroup.get(k);
      let pop;
      if (info && info.isDesignated && !expandedSet.has(k)) pop = info.aggregatePop;
      else pop = popMap.get(String(feature.properties.N03_007 || "").slice(0, 5));
      const hasData = activeMetric === "paidBag"
        ? (pop === 0 || pop === 1)
        : (activeMetric === "water100" || activeMetric === "hyakumeizan" || activeMetric === "nuclear" || activeMetric === "dam" || activeMetric === "military" || activeMetric === "heisei" || activeMetric === "airraid" || activeMetric === "park" || activeMetric === "ohsho" || activeMetric === "yamaokaya" || activeMetric === "rasho" || activeMetric === "yakimono" || activeMetric === "airport" || activeMetric === "sake" || activeMetric === "baseball" || activeMetric === "aging" || activeMetric === "bear")
        ? true  // 非該当 (undefined / 50%未満) も白で常に表示
        : !!(pop && pop > 0);
      const noDataColor = "#111";
      return {
        className: "city",
        fillColor: hasData ? popColor(pop, scale.minLog, scale.maxLog) : noDataColor,
        fillOpacity: hasData ? 0.9 : 1.0,
        color: "#8a6a2a",
        weight: 0.5,
        opacity: 1
      };
    };

    function applyData(newMap) {
      popMap.clear();
      for (const [k, v] of newMap) popMap.set(k, v);
      for (const info of cityGroup.values()) {
        for (const m of info.members) {
          if (m.code5 && !popMap.has(m.code5)) {
            const pref = m.code5.slice(0, 2);
            if (popMap.has(pref)) popMap.set(m.code5, popMap.get(pref));
          }
        }
      }
      recomputeAggregates();
      polygonLayer.setStyle(styleFor);
      updateMetricLabels();
      computePrefAggregates();
      applyPrefHeatmap();
    }
    function computePrefAggregates() {
      // 都道府県別の集計値 (低ズーム時のヒートマップ用)
      const isAvg = activeMetric === "density" || activeMetric === "aging" || activeMetric === "rainfall" || activeMetric === "avgAge" || activeMetric === "vacancy" || activeMetric === "restaurant" || activeMetric === "paidBag";
      // 二値メトリクス: 値の合計ではなく自治体数で評価したい (military は JSDF/US 個別カウント)
      const isBinary = ["water100","hyakumeizan","nuclear","dam","military","airport","park"].includes(activeMetric);
      const prefData = new Map();
      for (const info of cityGroup.values()) {
        for (const m of info.members) {
          const v = popMap.get(m.code5);
          if (v == null || !isFinite(v) || (v <= 0 && activeMetric !== "paidBag")) continue;
          const pref = info.prefName;
          if (!prefData.has(pref)) prefData.set(pref, { sum: 0, count: 0, jsdf: 0, us: 0, active: 0, cancelled: 0 });
          const d = prefData.get(pref);
          d.sum += v; d.count++;
          // military: 1=JSDF, 2=US
          if (activeMetric === "military") {
            if (v === 1) d.jsdf++;
            else if (v === 2) d.us++;
          }
          // nuclear: 1=現存, 2=計画中止
          if (activeMetric === "nuclear") {
            if (v === 1) d.active++;
            else if (v === 2) d.cancelled++;
          }
        }
      }
      nationalPrefAggregates = new Map();
      for (const [pref, d] of prefData) {
        if (d.count === 0) continue;
        // 二値系は自治体数(count) を集計値として使う
        const val = isBinary ? d.count : (isAvg ? d.sum / d.count : d.sum);
        nationalPrefAggregates.set(pref, val);
        // military / nuclear は内訳も保存
        if (activeMetric === "military") {
          nationalPrefAggregates.set(pref + "::jsdf", d.jsdf);
          nationalPrefAggregates.set(pref + "::us", d.us);
        }
        if (activeMetric === "nuclear") {
          nationalPrefAggregates.set(pref + "::active", d.active);
          nationalPrefAggregates.set(pref + "::cancelled", d.cancelled);
        }
      }
      // scale (use same fixed scales as munis for consistency)
      const vals = [...nationalPrefAggregates.values()].filter(v => v > 0);
      if (activeMetric === "aging") { nationalPrefScale = { minLog: Math.log10(30), maxLog: Math.log10(60) }; }
      else if (activeMetric === "avgAge") { nationalPrefScale = { minLog: Math.log10(40), maxLog: Math.log10(65) }; }
      else if (activeMetric === "rainfall") { nationalPrefScale = { minLog: Math.log10(1200), maxLog: Math.log10(2800) }; }
      else if (activeMetric === "vacancy") { nationalPrefScale = { minLog: Math.log10(10), maxLog: Math.log10(40) }; }
      else if (vals.length) {
        vals.sort((a, b) => a - b);
        const p5 = vals[Math.max(0, Math.floor(vals.length * 0.05))];
        const p95 = vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.95))];
        nationalPrefScale = { minLog: Math.log10(Math.max(p5, 1e-3)), maxLog: Math.log10(Math.max(p95, p5 * 1.01)) };
      } else {
        nationalPrefScale = { minLog: 0, maxLog: 1 };
      }
    }
    function updateMetricLabels() {
      const isAging = activeMetric === "aging";
      for (const marker of wardLabels) {
        const baseName = marker._name || "";
        if (isAging) {
          const v = popMap.get(marker._code5);
          if (v !== undefined && v >= 50) {
            marker.setIcon(L.divIcon({ className: "", html: `<div class="city-label-marker" style="color:#c00; font-weight:700;">${baseName}<br>(限界集落)</div>`, iconSize: [0, 0] }));
            continue;
          }
        }
        marker.setIcon(L.divIcon({ className: "", html: `<div class="city-label-marker">${baseName}</div>`, iconSize: [0, 0] }));
      }
    }
    nationalApplyData = applyData;
    nationalPopMap = popMap;
    // 初期ロード時にも県集計を計算しておく (低ズーム時のヒートマップ用)
    computePrefAggregates();
    applyPrefHeatmap();

    // 政令市の外周ポリゴンをプリ計算
    for (const info of cityGroup.values()) {
      if (info.isDesignated) info._outlineRings = computeDCOutlineLatLngs(info);
    }
    let dcOutlineLayer = null;
    function showDCOutline(info) {
      hideDCOutline();
      if (!info?._outlineRings?.length) return;
      dcOutlineLayer = L.polygon(info._outlineRings, {
        color: "#c00", weight: 3, fillOpacity: 0, interactive: false
      }).addTo(map);
    }
    function hideDCOutline() {
      if (dcOutlineLayer) { map.removeLayer(dcOutlineLayer); dcOutlineLayer = null; }
    }

    const prefToLayers = new Map();
    let dimmedLayers = null;
    let selectedKey = null;
    let selectedWardKey = null;
    const canvasRenderer = L.canvas({ padding: 0.5 });
    const polygonLayer = L.geoJSON(geo, {
      renderer: canvasRenderer,
      style: styleFor,
      onEachFeature: (feature, l) => {
        const pref = feature.properties.N03_001 || "";
        if (!prefToLayers.has(pref)) prefToLayers.set(pref, []);
        prefToLayers.get(pref).push(l);
        l.on("click", (e) => {
          L.DomEvent.stopPropagation(e);
          onCityClick(l);
        });
        l.on("mouseover", () => {
          if (selectedKey) return;
          if (dimmedLayers) {
            for (const o of dimmedLayers) o.setStyle({ fillOpacity: 0.9 });
          }
          const toDim = [];
          polygonLayer.eachLayer(other => {
            if ((other.feature.properties.N03_001 || "") !== pref) {
              other.setStyle({ fillOpacity: 0.7 });
              toDim.push(other);
            }
          });
          dimmedLayers = toDim;
        });
        l.on("mouseout", () => {
          if (selectedKey) return;
          if (dimmedLayers) {
            for (const o of dimmedLayers) o.setStyle({ fillOpacity: 0.9 });
            dimmedLayers = null;
          }
        });
      }
    });

    function applySelectionDim() {
      polygonLayer.eachLayer(l => {
        const p = l.feature.properties;
        const k = mergeKeyOf(p);
        let bright = !selectedKey;
        if (selectedKey) {
          if (selectedWardKey) bright = (String(p.N03_007||"").slice(0,5) === selectedWardKey);
          else bright = (k === selectedKey);
        }
        l.setStyle({ fillOpacity: bright ? 0.9 : 0.15 });
      });
    }
    function backOneLevel() {
      if (selectedWardKey) {
        selectedWardKey = null;
        if (selectedCity) { polygonLayer.resetStyle(selectedCity); selectedCity = null; }
        hideDCOutline();
        applySelectionDim();
        const info = cityGroup.get(selectedKey);
        titleEl.textContent = info.prefName || "";
        subtitleEl.textContent = info.displayName;
        const dcPop = (() => {
          let total = 0, any = false;
          for (const m of info.members) {
            const v = lookupPopulation(m.code5);
            if (v) { total += v; any = true; }
          }
          return any ? total : null;
        })();
        const popText = dcPop ? `${dcPop.toLocaleString()} 人` : "データなし";
        showDesignatedCityInfo(info, popText);
        return;
      }
      if (selectedKey) {
        selectedKey = null;
        expandedSet.clear();
        if (selectedCity) { polygonLayer.resetStyle(selectedCity); selectedCity = null; }
        hideDCOutline();
        polygonLayer.setStyle(styleFor);
        refreshLabels();
        titleEl.textContent = "";
        subtitleEl.textContent = "";
        contentEl.innerHTML = "";
      }
    }
    const clearSelection = backOneLevel;
    map.on("click", backOneLevel);
    nationalPolygonLayer = polygonLayer;
    nationalBackOneLevel = backOneLevel;
    nationalHasSelection = () => !!selectedKey;

    // 名前 → code5 リスト の lookup (有料ごみ袋など名前ベースデータ用)
    const nameMap = new Map();
    const addName = (key, codes) => {
      const existing = nameMap.get(key) || [];
      nameMap.set(key, existing.concat(codes));
    };
    for (const info of cityGroup.values()) {
      const allCodes = info.members.map(m => m.code5).filter(Boolean);
      if (info.isDesignated) {
        addName(`${info.prefName}|${info.displayName}`, allCodes);
      }
      for (const m of info.members) {
        if (m.code5) addName(`${info.prefName}|${m.name}`, [m.code5]);
      }
    }
    nationalNameLookup = (pref, muni) => nameMap.get(`${pref}|${muni}`);

    // 緯度経度 → code5 ルックアップ (地震など座標ベースデータ用)
    const muniSpatial = [];
    for (const info of cityGroup.values()) {
      for (const m of info.members) {
        if (!m.code5 || !m.rings.length) continue;
        let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
        for (const r of m.rings) {
          for (const p of r.ring) {
            if (p[0] < minLng) minLng = p[0];
            if (p[0] > maxLng) maxLng = p[0];
            if (p[1] < minLat) minLat = p[1];
            if (p[1] > maxLat) maxLat = p[1];
          }
        }
        muniSpatial.push({ code5: m.code5, minLng, minLat, maxLng, maxLat, rings: m.rings });
      }
    }
    const pointInRing = (lng, lat, ring) => {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    };
    nationalPointLookup = (lng, lat) => {
      for (const muni of muniSpatial) {
        if (lng < muni.minLng || lng > muni.maxLng || lat < muni.minLat || lat > muni.maxLat) continue;
        for (const r of muni.rings) {
          if (pointInRing(lng, lat, r.ring)) return muni.code5;
        }
      }
      return null;
    };
    // 海上震央など PIP 失敗時のために最寄り自治体を返す
    nationalNearestMuni = (lng, lat, maxKmDeg = 1.5) => {
      let best = null, bestSq = maxKmDeg * maxKmDeg;
      for (const muni of muniSpatial) {
        // bbox 拡張で大まかにフィルタ
        if (lng < muni.minLng - maxKmDeg || lng > muni.maxLng + maxKmDeg
            || lat < muni.minLat - maxKmDeg || lat > muni.maxLat + maxKmDeg) continue;
        const cx = (muni.minLng + muni.maxLng) / 2;
        const cy = (muni.minLat + muni.maxLat) / 2;
        const dx = lng - cx, dy = lat - cy;
        const sq = dx * dx + dy * dy;
        if (sq < bestSq) { bestSq = sq; best = muni.code5; }
      }
      return best;
    };

    const wardLabels = [];
    const cityLabels = [];
    for (const info of cityGroup.values()) {
      for (const m of info.members) {
        if (!m.rings.length) continue;
        const maxA = Math.max(...m.rings.map(r => r.area));
        for (const r of m.rings) {
          if (r.area < maxA * EXCLAVE_RATIO) continue;
          const c = ringCentroid(r.ring);
          if (!c || !isFinite(c[0]) || !isFinite(c[1])) continue;
          const marker = L.marker(c, {
            interactive: false, keyboard: false,
            icon: L.divIcon({ className: "", html: `<div class="city-label-marker">${m.name}</div>`, iconSize: [0, 0] })
          });
          marker._mergeKey = info.mergeKey;
          marker._code5 = m.code5;
          marker._name = m.name;
          wardLabels.push(marker);
        }
      }
      if (info.isDesignated) {
        let bestRing = null, bestA = 0;
        for (const m of info.members) {
          for (const r of m.rings) {
            if (r.area > bestA) { bestA = r.area; bestRing = r.ring; }
          }
        }
        if (bestRing) {
          const c = ringCentroid(bestRing);
          if (c && isFinite(c[0]) && isFinite(c[1])) {
            const marker = L.marker(c, {
              interactive: false, keyboard: false,
              icon: L.divIcon({ className: "", html: `<div class="city-label-marker city-label-dc">${info.displayName}</div>`, iconSize: [0, 0] })
            });
            marker._mergeKey = info.mergeKey;
            cityLabels.push(marker);
          }
        }
      }
    }

    const labelLayer = L.layerGroup();
    const refreshLabels = () => {
      labelLayer.clearLayers();
      for (const m of wardLabels) {
        const info = cityGroup.get(m._mergeKey);
        if (!info.isDesignated || expandedSet.has(m._mergeKey)) labelLayer.addLayer(m);
      }
      for (const m of cityLabels) {
        if (!expandedSet.has(m._mergeKey)) labelLayer.addLayer(m);
      }
    };
    refreshLabels();

    function onCityClick(polyLayer) {
      const f = polyLayer.feature;
      const props = f.properties;
      const k = mergeKeyOf(props);
      const info = cityGroup.get(k);
      const code5 = String(props.N03_007 || "").slice(0, 5);

      // 既に何か選択されている場合
      if (selectedKey) {
        // 政令市選択中で同じDC内の区クリック → drill-down (or 同じ区の再クリックで戻る)
        if (selectedKey === k && info.isDesignated) {
          if (selectedWardKey === code5) {
            backOneLevel();
            return;
          }
          selectedWardKey = code5;
          selectCity(polyLayer, {
            cityName: props.N03_004 || "(不明)",
            district: info.displayName,
            cityCode: props.N03_007 || "",
            prefName: info.prefName,
            pop: lookupPopulation(code5)
          });
          showDCOutline(info);
          applySelectionDim();
          return;
        }
        // それ以外のクリックは「戻る」
        backOneLevel();
        return;
      }

      // 新規選択 — 政令市は展開のみ
      if (info.isDesignated) {
        selectedKey = k;
        selectedWardKey = null;
        expandedSet.clear();
        expandedSet.add(k);
        if (selectedCity) {
          polygonLayer.resetStyle(selectedCity);
          selectedCity = null;
        }
        polygonLayer.setStyle(styleFor);
        refreshLabels();
        applySelectionDim();
        titleEl.textContent = info.prefName || "";
        subtitleEl.textContent = info.displayName;
        const dcPop = (() => {
          let total = 0, any = false;
          for (const m of info.members) {
            const v = lookupPopulation(m.code5);
            if (v) { total += v; any = true; }
          }
          return any ? total : null;
        })();
        const popText = dcPop ? `${dcPop.toLocaleString()} 人` : "データなし";
        showDesignatedCityInfo(info, popText);
        return;
      }

      // 新規選択 — 通常自治体
      selectedKey = k;
      selectedWardKey = null;
      expandedSet.clear();
      polygonLayer.setStyle(styleFor);
      refreshLabels();
      selectCity(polyLayer, {
        cityName: props.N03_004 || "(不明)",
        district: props.N03_003 || "",
        cityCode: props.N03_007 || "",
        prefName: info.prefName,
        pop: lookupPopulation(code5)
      });
      applySelectionDim();
    }

    const fg = L.featureGroup([polygonLayer]);
    fg._labelLayer = labelLayer;
    return fg;
  } finally {
    showLoad(false);
  }
}

function onMoveEnd() {
  const z = map.getZoom();
  const setPrefPointerEvents = (val) => {
    if (!prefLayer) return;
    prefLayer.eachLayer(l => {
      const el = l.getElement();
      if (el) el.style.pointerEvents = val;
    });
  };
  if (z < ZOOM_ALL_THRESHOLD) {
    if (cityLayer && map.hasLayer(cityLayer)) map.removeLayer(cityLayer);
    if (prefLayer) {
      if (!map.hasLayer(prefLayer)) map.addLayer(prefLayer);
      // ヒートマップ集計があれば反映、なければデフォルト淡色
      if (nationalPrefAggregates && nationalPrefAggregates.size > 0) {
        applyPrefHeatmap();
      } else {
        prefLayer.setStyle({ color: "#5b8db8", weight: 0.7, fillColor: "#cfe2f3", fillOpacity: 0.75 });
      }
      setPrefPointerEvents("");
    }
    if (prefLabelLayer) {
      const wantLabels = z >= PREF_LABEL_MIN_ZOOM;
      const has = map.hasLayer(prefLabelLayer);
      if (wantLabels && !has) map.addLayer(prefLabelLayer);
      if (!wantLabels && has) map.removeLayer(prefLabelLayer);
    }
    // 低ズームでもバックグラウンドで市区町村データを読み込む
    // → buildNationalLayer 内で computePrefAggregates → applyPrefHeatmap が走るので県別ヒートマップが反映される
    if (!cityLayer && !nationalLoading) {
      const initialMetric = activeMetric; // ロード開始時の指標を覚えておく
      nationalLoading = buildNationalLayer().then(layer => {
        cityLayer = layer; // 高ズームになったときに onMoveEnd が addLayer する
        updateColorLegend();
        preloadAllMetrics();
        // ビルド中にユーザーが別の指標に切り替えていたら、ここで再適用
        if (activeMetric !== initialMetric) switchMetric(activeMetric);
      }).catch(e => {
        console.warn("buildNationalLayer failed:", e.message);
      });
    }
    return;
  }
  if (prefLayer) {
    if (!map.hasLayer(prefLayer)) map.addLayer(prefLayer);
    prefLayer.setStyle({ color: "#0d2238", weight: 4, fillOpacity: 0, lineJoin: "round" });
    // z < LABEL_ZOOM ではpref全体をクリック可能(自治体は無視)、z >= LABEL_ZOOM では自治体クリックを優先
    setPrefPointerEvents(z < LABEL_ZOOM ? "fill" : "none");
  }
  if (prefLabelLayer) {
    // 市区町村ラベル(z >= LABEL_ZOOM)が出るまでは県名ラベルを表示
    const wantPref = z < LABEL_ZOOM;
    const has = map.hasLayer(prefLabelLayer);
    if (wantPref && !has) map.addLayer(prefLabelLayer);
    if (!wantPref && has) map.removeLayer(prefLabelLayer);
  }
  if (!cityLayer && !nationalLoading) {
    nationalLoading = buildNationalLayer().then(layer => {
      cityLayer = layer;
      if (map.getZoom() >= ZOOM_ALL_THRESHOLD) {
        map.addLayer(cityLayer);
        if (prefLayer) prefLayer.bringToFront();
      }
      updateColorLegend();
      preloadAllMetrics();
    }).catch(e => {
      contentEl.innerHTML = `<span style="color:#c00">市区町村データ取得失敗: ${e.message}</span>`;
    });
  } else if (cityLayer) {
    if (!map.hasLayer(cityLayer)) map.addLayer(cityLayer);
    if (prefLayer) prefLayer.bringToFront();
  }
  if (cityLayer && cityLayer._labelLayer) {
    const wantLabels = z >= LABEL_ZOOM;
    const hasLabels = map.hasLayer(cityLayer._labelLayer);
    if (wantLabels && !hasLabels) cityLayer._labelLayer.addTo(map);
    if (!wantLabels && hasLabels) map.removeLayer(cityLayer._labelLayer);
  }
}
map.on("moveend", onMoveEnd);

function lookupPopulation(code5) {
  const wiki = metricDataCache.get("population");
  const v = wiki?.get(code5);
  if (v) return v;
  const ssds = metricDataCache.get("_ssds_pop");
  return ssds?.get(code5);
}
function computePopRank(pop) {
  if (!pop) return null;
  const popData = metricDataCache.get("population");
  if (!popData) return null;
  const vals = [];
  for (const v of popData.values()) if (v > 0) vals.push(v);
  if (!vals.length) return null;
  vals.sort((a, b) => b - a);
  const rank = vals.findIndex(v => v <= pop) + 1;
  const total = vals.length;
  const percentile = Math.round((1 - (rank - 1) / total) * 100);
  let scaleLabel = "";
  if (percentile >= 95) scaleLabel = "全国でも極めて多い";
  else if (percentile >= 80) scaleLabel = "全国的に多い";
  else if (percentile >= 50) scaleLabel = "全国平均より多い";
  else if (percentile >= 20) scaleLabel = "全国平均より少ない";
  else scaleLabel = "全国的に少ない";
  return { rank, total, percentile, scaleLabel };
}

function extractWikiSection(text, sectionName, maxChars = 220) {
  if (!text) return null;
  const lines = text.split("\n");
  let inSection = false;
  let level = 0;
  const out = [];
  for (const line of lines) {
    const m = line.match(/^(=+)\s*(.+?)\s*\1\s*$/);
    if (m) {
      if (inSection) {
        if (m[1].length <= level) break;
      } else if (m[2].includes(sectionName)) {
        inSection = true;
        level = m[1].length;
      }
    } else if (inSection) {
      if (line.trim()) out.push(line.trim());
    }
  }
  let s = out.join(" ").trim();
  // ノイズ除去
  s = s
    .replace(/\[(注|出典|要出典|脚注)[^\]]*\]/g, "")
    .replace(/\[\d+\]/g, "")
    .replace(/（[^（）]{0,40}?(年|月|日|生|没|語|名|読み)[^（）]*?）/g, "")
    .replace(/\([^()]{0,30}?(year|AD|BC)[^()]*?\)/gi, "")
    .replace(/\s+/g, " ")
    .trim();
  // 4項目以上の「、」区切りリストは件数表記にまとめる (合併自治体の羅列対策)
  s = s.replace(/((?:[^、。\s]{1,50}、){3,}[^、。\s]{1,50})/g, (match) => {
    const items = match.split("、");
    const placeLike = items.filter(x => /[町村市区郡]$/.test(x.trim())).length;
    const label = (placeLike >= items.length * 0.6) ? "自治体" : "項目";
    return `${items.length}${label}`;
  });
  // 「← N自治体」のような直後の語尾を整形
  s = s.replace(/←\s*(\d+自治体)/g, "($1と合併)");
  // 文を選んで連結 (3〜4文ぶん)
  const sentences = s.split(/(?<=[。!?])/).map(x => x.trim()).filter(Boolean);
  // 「N項目」「N自治体」だけの無意味な文を除去
  const meaningful = sentences.filter(sen => {
    const stripped = sen.replace(/\s+/g, "").replace(/[。!?]+$/, "");
    return !/^\d+(自治体|項目)$/.test(stripped);
  });
  let result = "";
  for (const sen of meaningful) {
    if (result.length + sen.length > maxChars) break;
    result += sen;
    if (result.length >= maxChars * 0.7) break;
  }
  if (!result && meaningful.length) {
    // 切れ目のいいところで止める: 。 → 、 → スペース の順で探す
    const full = meaningful[0];
    if (full.length <= maxChars) return full;
    const cut = full.slice(0, maxChars);
    const sentenceEnd = Math.max(cut.lastIndexOf("。"), cut.lastIndexOf("!"), cut.lastIndexOf("?"));
    if (sentenceEnd > maxChars * 0.4) return cut.slice(0, sentenceEnd + 1);
    const commaEnd = Math.max(cut.lastIndexOf("、"), cut.lastIndexOf(","));
    if (commaEnd > maxChars * 0.4) return cut.slice(0, commaEnd);
    const spaceEnd = cut.lastIndexOf(" ");
    if (spaceEnd > maxChars * 0.4) return cut.slice(0, spaceEnd);
    result = cut;
  }
  return result || null;
}

function extractWikiIntro(text, maxChars = 500) {
  if (!text) return null;
  const lines = text.split("\n");
  const intro = [];
  for (const line of lines) {
    if (/^(=+)\s*.+?\s*\1\s*$/.test(line)) break;
    const s = line.trim();
    if (s) intro.push(s);
  }
  let s = intro.join(" ").replace(/\[\d+\]/g, "").replace(/\s+/g, " ").trim();
  if (s.length > maxChars) {
    s = s.slice(0, maxChars).replace(/[、。][^、。]*$/, "") + "。";
  }
  return s || null;
}

function extractSectionItems(text, sectionName, maxItems = 6) {
  if (!text) return [];
  const lines = text.split("\n");
  const items = [];
  let inSection = false;
  let level = 0;
  for (const line of lines) {
    const m = line.match(/^(=+)\s*(.+?)\s*\1\s*$/);
    if (m) {
      if (inSection && m[1].length <= level) break;
      if (!inSection && m[2].includes(sectionName)) {
        inSection = true; level = m[1].length;
      }
      continue;
    }
    if (!inSection) continue;
    let s = line.trim();
    if (!s) continue;
    s = s.replace(/\[\d+\]/g, "").replace(/^[・*\-\s　 ]+/, "").trim();
    if (s.length < 2 || s.length > 60) continue;
    if (/^[=\-*・■●◯○※]+$/.test(s)) continue;
    if (/。$/.test(s)) continue;
    if (/(参照|詳細|については|を参照)/.test(s)) continue;
    // 「主な〇〇」「〇〇など」 のようなサブ見出しを除外
    if (/(^|^[\s・*\-]*)主な/.test(s)) continue;
    if (/(など|その他)$/.test(s)) continue;
    if (/[寺院神社城郭公園美術館博物館史跡旧跡名所建築物建造物文化財]$/.test(s) && s.length <= 5) continue;
    // 単一カテゴリ語(具体名なし)を除外
    if (/^(城郭|寺院|神社|公園|博物館|美術館|史跡|旧跡|名所|観光地|観光施設|温泉|文化財|建造物|建築物|遺跡|庭園|城跡|寺社|教会|劇場|ホール|スタジアム|資料館|記念館|歴史|地理|気候|位置|交通|施設|スポット|文化|祭り|行事|イベント|特産|名産|食文化|料理|国宝|重要文化財|国指定文化財|県指定文化財|市指定文化財|町指定文化財|村指定文化財|天然記念物|特別名勝|名勝|文化遺産|世界遺産|景観|名水|名橋|商業施設|繁華街|商店街|テーマパーク|遊園地|動物園|植物園|水族館|スキー場|海水浴場|キャンプ場|登山|ハイキング|主な施設|主な祭|主な祭り|祭り行事|お祭り|年中行事|寺社仏閣|神社仏閣)$/.test(s)) continue;
    // 行政分類用語のみで構成された短い行(具体名なし)を除外
    if (s.length <= 14 && /^(重要|登録|選定|指定|国|県|市|町|村|国の|県の|市の|町の|国指定|県指定|市指定|町指定|村指定|特別|新|旧)?(有形|無形|民俗|的)?(文化財|建造物群|建造物|景観|遺跡|名勝|天然記念物|保存地区|伝統的建造物群|歴史的風土)$/.test(s)) continue;
    items.push(s);
    if (items.length >= maxItems) break;
  }
  return items;
}

function extractPeopleList(text) {
  if (!text) return null;
  const sectionNames = ["著名な出身者", "出身有名人", "著名人", "出身著名人", "出身者", "ゆかりの人物", "人物"];
  const lines = text.split("\n");
  for (const sec of sectionNames) {
    const collected = [];
    let inSection = false;
    let level = 0;
    for (const line of lines) {
      const m = line.match(/^(=+)\s*(.+?)\s*\1\s*$/);
      if (m) {
        if (inSection && m[1].length <= level) break;
        if (!inSection && (m[2] === sec || m[2].includes(sec))) {
          inSection = true; level = m[1].length;
        }
        continue;
      }
      if (!inSection) continue;
      let s = line.trim();
      if (!s) continue;
      s = s.replace(/\[(注|出典|要出典)[^\]]*\]/g, "").replace(/\[\d+\]/g, "").replace(/^[・*\-\s]+/, "").trim();
      if (s.length < 3 || s.length > 80) continue;
      if (s.startsWith("※") || s.startsWith("注")) continue;
      if (/^[=\-*・■●◯○※]+$/.test(s)) continue;
      if (/(参照|詳細は|については|を参照|それぞれの項)/.test(s)) continue;
      if (/^\d{3,4}年/.test(s)) continue;
      // メタ情報・合併情報・順序説明を除外
      if (/(五十音|Wikipedia|wikipedia|項目のある|の人物|順、|合併|町村|旧\d|^旧[一二三四五六七八九十])/.test(s)) continue;
      // 文章っぽい行(。で終わる、または特定の動詞形を含む)を除外
      if (/。$/.test(s)) continue;
      if (/(される|されている|することが|である。|顕彰|選定|として顕|条例に基づき|展示されて)/.test(s)) continue;
      // 政治家・官僚系は除外
      if (/(政治家|衆議院議員|参議院議員|元議員|国会議員|地方議員|県議|市議|町議|村議|知事|副知事|市長|町長|村長|区長|副市長|副町長|副村長|大臣|官房長官|総理|首相|官僚|外交官|大使|侍従|長官|委員長|委員会委員|会長|理事長)/.test(s)) continue;
      // カテゴリ見出し(政治・スポーツ等)を除外
      const bare = s.replace(/[（(].*?[)）]\s*$/, "").trim();
      if (/^(政治|行政|政治家|経済|経済人|実業家|実業|産業|文化|文化人|学術|学者|研究者|教育|教育者|芸能|芸能人|芸術|芸術家|音楽|音楽家|スポーツ|スポーツ選手|プロ野球|野球|サッカー|格闘技|ゴルフ|メディア|ジャーナリスト|作家|漫画家|アナウンサー|俳優|女優|歌手|アイドル|声優|監督|プロデューサー|宗教|軍人|皇族|華族|武将|ゆかり|出身|関連|その他)$/.test(bare)) continue;
      // 名前らしさ: 括弧 or 「、」 or 「ー/-」 を含む
      if (!/[(（、ーー\-]/.test(s)) continue;
      // ホワイトリスト: 芸能・スポーツ・文化系の職業名を含むものだけ採用
      const popular = /(俳優|女優|歌手|声優|アイドル|タレント|モデル|お笑い|芸人|コメディアン|アナウンサー|司会|キャスター|漫画家|小説家|作家|詩人|脚本家|映画監督|監督|プロデューサー|演出家|作曲家|作詞家|音楽家|ミュージシャン|ピアニスト|バンド|ラッパー|シンガー|画家|イラストレーター|デザイナー|ファッション|写真家|フォトグラファー|落語家|歌舞伎|野球選手|サッカー選手|プロ野球|プロサッカー|Jリーグ|プロレス|格闘家|柔道|相撲|力士|ボクサー|オリンピック|アスリート|陸上|水泳|スケート|フィギュア|ゴルフ|テニス|バスケ|バレー|スノーボード|スキー|料理人|シェフ|起業家|実業家|発明家|科学者|建築家)/;
      if (!popular.test(s)) continue;
      collected.push(s);
      if (collected.length >= 16) break;
    }
    if (collected.length) {
      // 優先度順にソート: tier1(芸能・スポーツ・漫画家・俳優・音楽) を先頭に
      const tier1 = /(俳優|女優|歌手|アイドル|タレント|声優|お笑い|芸人|コメディアン|モデル|音楽家|ミュージシャン|バンド|ラッパー|シンガー|ピアニスト|作曲家|作詞家|漫画家|プロ野球|サッカー選手|Jリーグ|力士|相撲|柔道|プロレス|格闘家|ボクサー|オリンピック|アスリート|陸上|水泳|スケート|フィギュア|ゴルフ|テニス|バスケ|バレー|スノーボード|スキー)/;
      collected.sort((a, b) => (tier1.test(a) ? 0 : 1) - (tier1.test(b) ? 0 : 1));
      return collected;
    }
  }
  return null;
}

async function checkWikipediaPageExists(title) {
  try {
    const url = `https://ja.wikipedia.org/w/api.php?action=query&prop=info&titles=${encodeURIComponent(title)}&redirects=1&format=json&origin=*`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const pages = data.query?.pages || {};
    const page = Object.values(pages)[0];
    if (!page || page.missing !== undefined) return null;
    return page.title || title;
  } catch (_) {
    return null;
  }
}

// summary API を直接叩いてヒットすれば即返す。
// 404 / disambiguation の場合のみ次の候補へ。
// findWikipediaTitle と異なり、要約取得まで含めて 1 リクエスト/候補。
async function findWikipediaSummary(info) {
  const cands = [];
  // 政令市の区 (例: 港区 in 大阪市) → 「大阪市港区」を先に試す
  if (info.district && DESIGNATED_CITIES.has(info.district)) {
    cands.push(`${info.district}${info.cityName}`);
    cands.push(`${info.cityName} (${info.district})`);
  }
  // 都道府県付き (港区 (東京都) など曖昧さ回避用)
  if (info.prefName) cands.push(`${info.cityName} (${info.prefName})`);
  // そのまま (岩泉町、葛飾区 など、多くの自治体はこれでヒット)
  cands.push(info.cityName);

  for (const title of cands) {
    try {
      const url = `https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
      const res = await fetch(url);
      if (!res.ok) {
        console.log(`[wiki] ${title}: HTTP ${res.status}`);
        continue;
      }
      const data = await res.json();
      if (data.type === "disambiguation") {
        console.log(`[wiki] ${title}: disambiguation, skip`);
        continue;
      }
      console.log(`[wiki] hit: ${title} → ${data.title}`);
      return data;
    } catch (e) {
      console.log(`[wiki] ${title}: ${e.message}`);
    }
  }

  // フォールバック: 全文検索 → 最初のヒットの summary を取得
  const prefStem = info.prefName?.replace(/[都道府県]$/, "") || "";
  try {
    const url = `https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(info.cityName + " " + (info.prefName || ""))}&srlimit=10&format=json&origin=*`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      const results = data.query?.search || [];
      const exact = results.find(r => r.title === info.cityName);
      const good = exact || results.find(r => r.title.includes(info.cityName) && (prefStem ? (r.snippet?.includes(prefStem) || r.title.includes(prefStem)) : true));
      if (good) {
        const s = await fetchWikipediaSummary(good.title);
        if (s) {
          console.log(`[wiki] hit via search: ${good.title}`);
          return s;
        }
      }
    }
  } catch (_) {}
  console.log(`[wiki] miss: ${info.cityName} (${info.prefName})`);
  return null;
}

async function renderWikipediaInfo(info, token) {
  const wiki = await findWikipediaSummary(info);
  if (token !== cityLoadToken) return;
  const hitTitle = wiki?.title;
  const wikiEl = document.getElementById("wiki-content");
  if (!wikiEl) return;

  if (!wiki) {
    wikiEl.classList.remove("placeholder");
    wikiEl.innerHTML = `<div class="placeholder">Wikipediaに該当記事が見つかりませんでした。</div>`;
    return;
  }

  const thumb = wiki.thumbnail?.source ? `<img class="wiki-thumb" src="${wiki.thumbnail.source}" alt="">` : "";
  wikiEl.classList.remove("placeholder");
  wikiEl.innerHTML = `
    ${thumb}
    <p class="wiki-extract">${wiki.extract}</p>
    <div id="wiki-industry" class="placeholder" style="font-size:12px;">産業情報を取得中…</div>
    <div id="wiki-tourism" class="placeholder" style="font-size:12px;">観光情報を取得中…</div>
    <div id="wiki-specialty" class="placeholder" style="font-size:12px;">特産物情報を取得中…</div>
    <div id="wiki-people" class="placeholder" style="font-size:12px;">著名人情報を取得中…</div>
  `;

  const fullText = await fetchWikipediaPlainText(hitTitle);
  if (token !== cityLoadToken) return;

  // 概要を全文プレインテキストの冒頭で差し替え(常に rich intro 優先)
  const richIntro = extractWikiIntro(fullText, 600);
  if (richIntro && richIntro.length >= 60) {
    const extractEl = wikiEl.querySelector(".wiki-extract");
    if (extractEl) extractEl.textContent = richIntro;
  }

  const sectionStyle = (el) => {
    el.classList.remove("placeholder");
    el.style.fontSize = "13px";
    el.style.lineHeight = "1.6";
    el.style.marginTop = "10px";
    el.style.color = "#333";
  };

  const indEl = document.getElementById("wiki-industry");
  if (indEl) {
    // 産業セクションは長文が多いので maxChars を増やす
    const ind = extractWikiSection(fullText, "産業", 500)
      || extractWikiSection(fullText, "経済", 500);
    // 「面白い」判定: 十分な長さ + 具体的な数値 or 固有名詞があるもののみ表示
    // 単なる業種列挙 (例: 「農業・漁業・鉱業」) は載せない
    const isInteresting = (() => {
      if (!ind || ind.length < 120) return false;
      // 文末「。」が 2 つ以上 (=2 文以上のまとまった記述)
      const periods = (ind.match(/。/g) || []).length;
      if (periods < 2) return false;
      // 具体性: 数値 (億/万/円/年/%/トン/位) を 2 つ以上含む
      const concreteMatches = ind.match(/\d+\s*(億|万|円|年|%|％|トン|位|人|社|名)/g) || [];
      if (concreteMatches.length < 2) return false;
      return true;
    })();
    if (isInteresting) {
      sectionStyle(indEl);
      indEl.innerHTML = `<strong>産業・経済</strong><br>${ind.replace(/\n+/g, "<br>")}`;
    } else {
      indEl.remove();
    }
  }

  const tourEl = document.getElementById("wiki-tourism");
  if (tourEl) {
    const candidates = [
      ["観光", "観光"], ["名所", "観光"], ["見どころ", "観光"], ["観光地", "観光"], ["観光名所", "観光"],
      ["名所・旧跡", "観光"], ["旧跡", "観光"], ["史跡", "観光"]
    ];
    let items = [];
    let heading = "観光";
    for (const [sec, h] of candidates) {
      const list = extractSectionItems(fullText, sec, 6);
      if (list.length) { items = list; heading = h; break; }
    }
    if (items.length) {
      sectionStyle(tourEl);
      tourEl.innerHTML = `<strong>${heading}</strong><br>${items.map(it => `・${it}`).join("<br>")}`;
    } else {
      tourEl.remove();
    }
  }

  const specEl = document.getElementById("wiki-specialty");
  if (specEl) {
    const spec = extractWikiSection(fullText, "特産品")
      || extractWikiSection(fullText, "特産物")
      || extractWikiSection(fullText, "名産品")
      || extractWikiSection(fullText, "名産")
      || extractWikiSection(fullText, "特産");
    if (spec) { sectionStyle(specEl); specEl.innerHTML = `<strong>特産物</strong><br>${spec.replace(/\n+/g, "<br>")}`; }
    else specEl.remove();
  }

  const peopleEl = document.getElementById("wiki-people");
  if (peopleEl) {
    const people = extractPeopleList(fullText);
    if (people && people.length) {
      sectionStyle(peopleEl);
      peopleEl.innerHTML = `<strong>著名人</strong><br>${people.slice(0, 6).map(p => `・${p}`).join("<br>")}`;
    } else {
      peopleEl.remove();
    }
  }
}

function getMajorEarthquakesByCode() {

function formatLegendNum(n) {
  if (!isFinite(n) || n <= 0) return "—";
  if (n >= 1e8) return (n / 1e8).toFixed(2) + "億";
  if (n >= 1e4) return (n / 1e4).toFixed(1) + "万";
  if (n >= 100) return Math.round(n).toLocaleString();
  return n.toFixed(1);
}
function updateColorLegend() {
  const bar = document.getElementById("legend-bar");

  // 「黒色: データなし」の表示制御 — データなしを白で表示する指標では非表示
  const noDataEl = document.getElementById("legend-nodata");
  if (noDataEl) {

    const [r, g, b] = team.color;

    const fade = (pct) => {

      const fr = Math.round(255 - (255 - r) * ease);
      const fg = Math.round(255 - (255 - g) * ease);
      const fb = Math.round(255 - (255 - b) * ease);

let preloadStarted = false;
async function preloadAllMetrics() {

  const keys = Object.keys(METRICS).filter(k => METRICS[k].ready && !metricDataCache.has(k));
  if (keys.length === 0) return;
  showLoad(true);
  let done = 0;
  setLoadProgress("データ読み込み中 0%", 0, `0 / ${keys.length}`);
  await Promise.all(keys.map(async (k) => {
    const label = METRICS[k].label || k;
    try {
      const data = await METRICS[k].loader();
      if (data && data.size > 0) metricDataCache.set(k, data);
      console.log(`[preload] ${k}: ${data?.size || 0} muni`);
    } catch (e) {
      console.warn(`[preload] ${k} 失敗:`, e.message);
    }
    done++;
    const pct = Math.round((done / keys.length) * 100);
    setLoadProgress(`データ読み込み中 ${pct}%`, pct, `${done} / ${keys.length} 完了 (${label})`);
  }));
  setLoadProgress("読み込み完了 100%", 100, "");
  console.log("[preload] 完了");
  setTimeout(() => showLoad(false), 400);
}

    let dataMap = metricDataCache.get(key);
    if (!dataMap) {
      try {
        dataMap = await METRICS[key].loader();
      } catch (err) {
        console.error(`[${key}] loader error:`, err);
        const el = metricNoteEl();
        if (el) el.innerHTML = `<span style="color:#c00">取得失敗: ${err.message}</span>`;
        dataMap = new Map();
      }
      if (dataMap.size > 0) metricDataCache.set(key, dataMap);
    }
    // ローカル変数 activeMetric は await の間に変わっている可能性がある → 最新で再チェック
    if (activeMetric !== key) {
      console.log(`[switchMetric] ${key}: データ取得中に ${activeMetric} に切替 → apply 中断`);
      return;
    }
    console.log(`[switchMetric] ${key}: applying (${dataMap.size} muni)`);
    nationalApplyData(dataMap);
    updateColorLegend();
  } finally {
    showLoad(false);
  }
}
initMetricSelect();

loadPrefectures().catch(e => {
  contentEl.innerHTML = `<span style="color:#c00">初期データ取得失敗: ${e.message}</span>`;
  showLoad(false);
});
</script>
</body>
</html>
